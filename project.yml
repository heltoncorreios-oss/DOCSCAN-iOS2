name: DOCSCAN
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: com.example.docscan
    INFOPLIST_KEY_CFBundleDisplayName: DOCSCAN
    INFOPLIST_KEY_NSCameraUsageDescription: O DOCSCAN precisa acessar a câmera para digitalizar documentos.
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  DOCSCAN:
    type: application
    platform: iOS
    sources:
      - path: Sources/DOCSCAN
    settings:
      base:
        PRODUCT_NAME: DOCSCAN
        SWIFT_EMIT_LOC_STRINGS: YES
